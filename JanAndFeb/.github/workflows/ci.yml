# GitHub Actions CI Pipeline
# Question 12: Fail-fast CI with proper ordering
#
# Pipeline stages (in fail-fast order):
# 1. Lint/format checks (fastest)
# 2. Type checks
# 3. Unit tests
# 4. Build Docker image
# 5. Security scan
# 6. Integration tests (slowest)

name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "Jan/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Jan/**"

defaults:
  run:
    working-directory: Jan

env:
  PYTHON_VERSION: "3.12"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/energy-trading-platform

jobs:
  # ==========================================================================
  # Stage 1: Lint (fastest - fail fast on style issues)
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run ruff formatter check
        run: ruff format --check src/ tests/

  # ==========================================================================
  # Stage 2: Type Check
  # ==========================================================================
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/ --strict

  # ==========================================================================
  # Stage 3: Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: Jan/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ==========================================================================
  # Stage 4: Build Docker Images
  # ==========================================================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      producer-image: ${{ steps.meta-producer.outputs.tags }}
      consumer-image: ${{ steps.meta-consumer.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Producer image
      - name: Extract metadata (producer)
        id: meta-producer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/producer
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build producer image
        uses: docker/build-push-action@v5
        with:
          context: Jan
          file: Jan/docker/producer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-producer.outputs.tags }}
          labels: ${{ steps.meta-producer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Consumer image
      - name: Extract metadata (consumer)
        id: meta-consumer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}/consumer
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build consumer image
        uses: docker/build-push-action@v5
        with:
          context: Jan
          file: Jan/docker/consumer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-consumer.outputs.tags }}
          labels: ${{ steps.meta-consumer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Stage 5: Security Scan
  # ==========================================================================
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (producer)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.producer-image }}
          format: "sarif"
          output: "trivy-producer-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy vulnerability scanner (consumer)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.consumer-image }}
          format: "sarif"
          output: "trivy-consumer-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-producer-results.sarif"

  # ==========================================================================
  # Stage 6: Integration Tests (slowest)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trades
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        env:
          POSTGRES_DSN: postgresql://trading:trading@localhost:5432/trades
        run: |
          PGPASSWORD=trading psql -h localhost -U trading -d trades -f sql/schema/001_create_trade_aggregates.sql
          PGPASSWORD=trading psql -h localhost -U trading -d trades -f sql/schema/002_create_indexes.sql

      - name: Run integration tests
        env:
          POSTGRES_DSN: postgresql://trading:trading@localhost:5432/trades
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          pytest tests/integration -v --tb=short || echo "Integration tests skipped (Kafka not available)"

  # ==========================================================================
  # Summary Job
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, build, integration-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
