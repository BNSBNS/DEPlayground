[project]
name = "energy-trading-platform"
version = "1.0.0"
description = "Real-time energy trading analytics platform with Kafka streaming and PostgreSQL storage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Energy Trading Team" }]

dependencies = [
    # Kafka
    "confluent-kafka>=2.3.0",

    # Database
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",

    # Data Validation & Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",

    # Utilities
    "structlog>=23.2.0",
    "python-dateutil>=2.8.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",

    # Chat interface
    "gradio>=4.0.0",
    "httpx>=0.25.0",

    # Async I/O
    "aiofiles>=23.2.0",
    "aiohttp>=3.9.0",

    # Metrics
    "prometheus_client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "testcontainers[kafka,postgres]>=3.7.0",
    "types-python-dateutil>=2.8.0",
    "pandas-stubs>=2.1.0",
]
ml = [
    # Classical + gradient boosting
    "scikit-learn>=1.5",
    "statsmodels>=0.14.2",
    "lightgbm>=4.5",
    # Deep learning
    "torch>=2.4",
    # Persistence + scheduling
    "joblib>=1.4",
    "apscheduler>=3.10",
]

[project.scripts]
trade-producer = "src.producer.main:main"
trade-consumer = "src.consumer.main:main"
trade-ingestion = "src.ingestion.main:main"
trade-api = "src.api.main:main"
trade-chat = "src.chat.app:main"
trade-ml = "src.ml.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff configuration (fast linting, replaces flake8+isort+black)
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration (strict type checking)
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "testcontainers.*",
    "aiofiles.*",
    # Optional ML stack — installed via the `[ml]` extras. The forecasting
    # layer is guarded behind these imports so missing types should not
    # fail strict mypy in base installs.
    "statsmodels.*",
    "lightgbm.*",
    "sklearn.*",
    "joblib.*",
    "apscheduler.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

# The deep-learning adapters interact with torch, whose public stubs
# are intentionally loose (Tensor operations typically return ``Any``
# and nn.ModuleDict is typed as Module, not Mapping). Strict mypy
# therefore flags patterns that are idiomatic torch code. The two
# environments — local without ``[ml]`` extras, and the ml container
# with torch present — produce different error sets, so we silence the
# union of both here.
[[tool.mypy.overrides]]
module = ["src.ml.models.deep.*"]
warn_unused_ignores = false
disable_error_code = ["import-not-found", "misc", "no-any-return", "index"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require Docker containers)",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80
