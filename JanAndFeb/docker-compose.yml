services:
  # Kafka in KRaft mode (no Zookeeper required)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listener configuration
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Log settings
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft cluster ID (must be consistent across restarts)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - trading-network

  # Kafka topic initialization
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-raw --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-dlq --partitions 3 --replication-factor 1
      echo 'Topics created successfully:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - trading-network

  # PostgreSQL database (TimescaleDB image — the schema under
  # sql/schema/003_timescaledb_setup.sql and 007_create_ml_tables.sql
  # both call ``create_hypertable``, which requires the extension).
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trades}
    volumes:
      - ./sql/schema:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trades}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  # Trade event producer (synthetic data generator)
  producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: trade-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: trades
      PRODUCER_RATE: ${PRODUCER_RATE:-10}
      PRODUCER_BURST_ENABLED: ${PRODUCER_BURST_ENABLED:-true}
      PRODUCER_BURST_MULTIPLIER: ${PRODUCER_BURST_MULTIPLIER:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - trading-network

  # Multi-source data ingestion service
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: trade-ingestion
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8003:8003"  # Prometheus metrics
    environment:
      # Kafka settings
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades-dlq

      # Ingestion settings
      INGESTION_METRICS_PORT: 8003
      INGESTION_METRICS_ENABLED: "true"
      INGESTION_DLQ_ENABLED: "true"

      # WebSocket source (Finnhub)
      WS_ENABLED: ${WS_ENABLED:-false}
      WS_NAME: finnhub
      WS_URL: wss://ws.finnhub.io
      WS_API_KEY: ${FINNHUB_API_KEY:-}
      WS_SYMBOLS: ${WS_SYMBOLS:-AAPL,GOOGL,MSFT,AMZN}

      # SSE source (DexPaprika)
      SSE_ENABLED: ${SSE_ENABLED:-false}
      SSE_NAME: dexpaprika
      SSE_URL: https://api.dexpaprika.com/sse/prices
      SSE_SYMBOLS: ${SSE_SYMBOLS:-BTC,ETH,SOL}

      # Polling source (ENTSO-E)
      POLLING_ENABLED: ${POLLING_ENABLED:-false}
      POLLING_NAME: entsoe
      POLLING_URL: https://web-api.tp.entsoe.eu/api
      POLLING_API_KEY: ${ENTSOE_API_KEY:-}
      POLLING_POLL_INTERVAL: ${POLLING_INTERVAL:-60}
      POLLING_AREAS: ${POLLING_AREAS:-DE,FR,NL}

      # Webhook source
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-false}
      WEBHOOK_NAME: webhook
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: 8080
      WEBHOOK_PATH: /webhook/trades

      # Micro-batch settings
      MICROBATCH_ENABLED: ${MICROBATCH_ENABLED:-false}
      MICROBATCH_NAME: micro_batch
      MICROBATCH_WINDOW_SECONDS: ${MICROBATCH_WINDOW:-10}
      MICROBATCH_MAX_BATCH_SIZE: ${MICROBATCH_SIZE:-1000}

      # Batch file processing
      BATCH_ENABLED: ${BATCH_ENABLED:-false}
      BATCH_NAME: batch
      BATCH_DIRECTORY: /data/imports
      BATCH_FILE_PATTERN: "*.csv"

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/imports:/data/imports:ro
    restart: unless-stopped
    networks:
      - trading-network

  # Streaming consumer with windowed aggregation
  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: trade-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades-dlq
      KAFKA_CONSUMER_GROUP: trade-aggregator
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trades}
      WINDOW_DURATION_SECONDS: ${WINDOW_DURATION_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - trading-network

  # =========================================================================
  # ML / Forecasting services
  # =========================================================================
  # The ML image is heavy (~2 GB: torch + lightgbm + statsmodels) so it is
  # gated behind the `ml` compose profile. Core trading services are NOT
  # affected; running `docker compose up` without `--profile ml` leaves the
  # forecasting stack untouched.
  #
  #   docker compose --profile ml up -d ml-scheduler
  #   docker compose --profile ml run --rm ml-trainer trade-ml train \
  #       --model gru --symbol POWER_DE
  # =========================================================================

  # Long-running periodic retraining loop (APScheduler cron).
  ml-scheduler:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    image: trade-ml:latest
    container_name: trade-ml-scheduler
    profiles: ["ml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trades}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trades}
      ML_MODEL_NAME: ${ML_MODEL_NAME:-lightgbm}
      ML_HORIZON_MINUTES: ${ML_HORIZON_MINUTES:-15}
      ML_SYMBOLS: ${ML_SYMBOLS:-["POWER_DE"]}
      ML_RETRAIN_CRON: ${ML_RETRAIN_CRON:-0 2 * * *}
      ML_MODEL_STORE_PATH: /app/data/ml_models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ml_models:/app/data/ml_models
    command: ["trade-ml", "schedule"]
    restart: unless-stopped
    networks:
      - trading-network

  # One-shot trainer. Override `command` at invocation time.
  # Usage:
  #   docker compose --profile ml run --rm ml-trainer \
  #       trade-ml train --model gru --symbol POWER_DE
  ml-trainer:
    build:
      context: .
      dockerfile: docker/ml/Dockerfile
    image: trade-ml:latest
    container_name: trade-ml-trainer
    profiles: ["ml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trades}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trades}
      ML_MODEL_STORE_PATH: /app/data/ml_models
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ml_models:/app/data/ml_models
    entrypoint: []
    command: ["trade-ml", "--help"]
    networks:
      - trading-network

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  ml_models:
    driver: local

networks:
  trading-network:
    driver: bridge
