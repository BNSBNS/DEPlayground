# Prometheus configuration for Energy Trading Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Trade API metrics (disabled - no /metrics endpoint yet)
  # - job_name: "trade-api"
  #   static_configs:
  #     - targets: ["api:8000"]
  #   metrics_path: /metrics

  # Trade Consumer metrics
  - job_name: "trade-consumer"
    static_configs:
      - targets: ["trade-consumer:8001"]
    metrics_path: /metrics

  # Trade Producer metrics
  - job_name: "trade-producer"
    static_configs:
      - targets: ["trade-producer:8002"]
    metrics_path: /metrics

  # Trade Ingestion metrics (multi-source ingestion)
  # Uses container_name which is the same for all ingestion profiles
  - job_name: "trade-ingestion"
    static_configs:
      - targets: ["trade-ingestion:8003"]
    metrics_path: /metrics
