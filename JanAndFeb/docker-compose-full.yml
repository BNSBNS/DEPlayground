version: "3.8"

# Full E2E streaming stack for local development and testing
# Includes: Kafka (KRaft), TimescaleDB, Producer, Ingestion, Consumer, API, Superset, Monitoring
#
# INGESTION MODES:
#   docker compose -f docker-compose-full.yml --profile local up      # Synthetic data (default)
#   docker compose -f docker-compose-full.yml --profile realtime up   # Real-time APIs
#   docker compose -f docker-compose-full.yml --profile batch up      # Batch file processing
#   docker compose -f docker-compose-full.yml --profile hybrid up     # Real-time + Batch

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/${POSTGRES_DB:-trades}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-ingestion-base: &ingestion-base
  build:
    context: .
    dockerfile: docker/ingestion/Dockerfile
  ports:
    - "8003:8003"
  volumes:
    - ./data/imports:/data/imports:ro
  depends_on:
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ============================================
  # INFRASTRUCTURE - Kafka in KRaft Mode (No Zookeeper)
  # ============================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listener configuration
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Topic settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Log settings
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft cluster ID (must be consistent across restarts)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-raw --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trades-dlq --partitions 3 --replication-factor 1
      echo 'Topics created successfully:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ============================================
  # DATABASE (TimescaleDB)
  # ============================================

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trades}
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema/001_create_trade_aggregates.sql:/docker-entrypoint-initdb.d/001_create_trade_aggregates.sql:ro
      - ./sql/schema/002_create_indexes.sql:/docker-entrypoint-initdb.d/002_create_indexes.sql:ro
      - ./sql/schema/003_timescaledb_setup.sql:/docker-entrypoint-initdb.d/003_timescaledb_setup.sql:ro
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trades}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # APPLICATIONS - DATA PRODUCERS
  # ============================================

  # LOCAL MODE: Synthetic trade producer (default)
  producer:
    profiles: ["local"]
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    container_name: trade-producer
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      PRODUCER_RATE: ${PRODUCER_RATE:-10}
      PRODUCER_BURST_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # REALTIME MODE: Real-time API ingestion (WebSocket, SSE, Polling)
  ingestion-realtime:
    <<: *ingestion-base
    container_name: trade-ingestion
    profiles: ["realtime"]
    environment:
      <<: *common-env
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades-dlq
      INGESTION_MODE: realtime
      INGESTION_METRICS_PORT: 8003
      INGESTION_METRICS_ENABLED: "true"
      INGESTION_DLQ_ENABLED: "true"

      # WebSocket source (Finnhub) - Stock/Crypto trades
      WS_ENABLED: ${WS_ENABLED:-true}
      WS_NAME: finnhub
      WS_URL: wss://ws.finnhub.io
      WS_API_KEY: ${FINNHUB_API_KEY:-demo}
      WS_SYMBOLS: '["AAPL","GOOGL","MSFT","AMZN","BINANCE:BTCUSDT"]'

      # SSE source (DexPaprika) - Crypto prices
      SSE_ENABLED: ${SSE_ENABLED:-true}
      SSE_NAME: dexpaprika
      SSE_URL: https://api.dexpaprika.com/sse/prices
      SSE_SYMBOLS: '["BTC","ETH","SOL"]'

      # Polling source (ENTSO-E) - Energy prices
      POLLING_ENABLED: ${POLLING_ENABLED:-false}
      POLLING_NAME: entsoe
      POLLING_URL: https://web-api.tp.entsoe.eu/api
      POLLING_API_KEY: ${ENTSOE_API_KEY:-}
      POLLING_POLL_INTERVAL: ${POLLING_INTERVAL:-60}
      POLLING_AREAS: '["DE","FR","NL"]'

  # BATCH MODE: Batch file processing
  ingestion-batch:
    <<: *ingestion-base
    container_name: trade-ingestion
    profiles: ["batch"]
    environment:
      <<: *common-env
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades-dlq
      INGESTION_MODE: batch
      INGESTION_METRICS_PORT: 8003
      INGESTION_METRICS_ENABLED: "true"
      INGESTION_DLQ_ENABLED: "true"

      # Batch file processing
      BATCH_ENABLED: "true"
      BATCH_NAME: batch
      BATCH_DIRECTORY: /data/imports
      BATCH_FILE_PATTERN: ${BATCH_PATTERN:-*.csv}
      BATCH_POLL_INTERVAL: ${BATCH_POLL_INTERVAL:-60}

      # Micro-batch (for streaming batch windows)
      MICROBATCH_ENABLED: ${MICROBATCH_ENABLED:-false}
      MICROBATCH_NAME: micro_batch
      MICROBATCH_WINDOW_SECONDS: ${MICROBATCH_WINDOW:-10}
      MICROBATCH_MAX_BATCH_SIZE: ${MICROBATCH_SIZE:-1000}

  # HYBRID MODE: Real-time + Batch
  ingestion-hybrid:
    <<: *ingestion-base
    container_name: trade-ingestion
    profiles: ["hybrid"]
    environment:
      <<: *common-env
      KAFKA_TOPIC: trades
      KAFKA_DLQ_TOPIC: trades-dlq
      INGESTION_MODE: hybrid
      INGESTION_METRICS_PORT: 8003
      INGESTION_METRICS_ENABLED: "true"
      INGESTION_DLQ_ENABLED: "true"

      # Real-time sources
      WS_ENABLED: ${WS_ENABLED:-true}
      WS_NAME: finnhub
      WS_URL: wss://ws.finnhub.io
      WS_API_KEY: ${FINNHUB_API_KEY:-demo}
      WS_SYMBOLS: '["AAPL","GOOGL","MSFT","AMZN"]'

      SSE_ENABLED: ${SSE_ENABLED:-true}
      SSE_NAME: dexpaprika
      SSE_URL: https://api.dexpaprika.com/sse/prices
      SSE_SYMBOLS: '["BTC","ETH","SOL"]'

      POLLING_ENABLED: ${POLLING_ENABLED:-false}
      POLLING_NAME: entsoe
      POLLING_URL: https://web-api.tp.entsoe.eu/api
      POLLING_API_KEY: ${ENTSOE_API_KEY:-}
      POLLING_POLL_INTERVAL: ${POLLING_INTERVAL:-60}
      POLLING_AREAS: '["DE","FR","NL"]'

      # Batch sources
      BATCH_ENABLED: ${BATCH_ENABLED:-true}
      BATCH_NAME: batch
      BATCH_DIRECTORY: /data/imports
      BATCH_FILE_PATTERN: ${BATCH_PATTERN:-*.csv}

  # ============================================
  # APPLICATIONS - CONSUMERS
  # ============================================

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: trade-consumer
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      KAFKA_CONSUMER_GROUP: trade-aggregator
      WINDOW_DURATION_SECONDS: 60
      LATE_EVENT_GRACE_SECONDS: 30
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: trade-api
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      DEBUG: "false"
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================
  # ANALYTICS (Superset)
  # ============================================

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      # Use env vars from .env.secrets (fallback to dev defaults for local)
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-energy-trading-local-dev-key}
      SQLALCHEMY_DATABASE_URI: "postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/${POSTGRES_DB:-trades}"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ==========================================================================
    # SUPERSET INITIALIZATION (run after first start):
    # ==========================================================================
    # 1. Initialize the database:
    #    docker exec superset superset db upgrade
    #
    # 2. Create admin user (use credentials from .env.secrets):
    #    docker exec superset superset fab create-admin \
    #      --username ${SUPERSET_ADMIN_USERNAME:-admin} \
    #      --firstname Admin --lastname User \
    #      --email ${SUPERSET_ADMIN_EMAIL:-admin@localhost} \
    #      --password ${SUPERSET_ADMIN_PASSWORD:-admin}
    #
    # 3. Initialize Superset:
    #    docker exec superset superset init
    #
    # Quick version (default admin/admin):
    #    docker exec superset superset db upgrade && \
    #    docker exec superset superset fab create-admin \
    #      --username admin --firstname Admin --lastname User \
    #      --email admin@local --password admin && \
    #    docker exec superset superset init
    # ==========================================================================

  # ============================================
  # CHAT WITH DATA (Natural Language Queries)
  # ============================================

  chat:
    build:
      context: .
      dockerfile: docker/chat/Dockerfile
    container_name: trade-chat
    ports:
      - "7860:7860"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@timescaledb:5432/${POSTGRES_DB:-trades}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - timescaledb
    restart: unless-stopped

  # ============================================
  # MONITORING
  # ============================================

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  kafka_data:
  timescale_data:
  redis_data:
  superset_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trading-network
