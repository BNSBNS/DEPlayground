[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infrascanner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "jinja2>=3.1",
    "typer>=0.15",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
infrascan = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
omit = ["*/dashboard/*", "*/cli.py", "*/nvd_client.py", "*/dependency_scanner.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF"]
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0915", "TC001", "TC003", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/*" = ["E402", "PLC0415"]
"src/cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["typer", "typer.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
