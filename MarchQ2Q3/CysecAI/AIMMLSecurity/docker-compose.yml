services:
  api:
    build:
      context: ..
      dockerfile: AIMMLSecurity/Dockerfile
      target: api
    ports:
      - "8000:8000"
    environment:
      AIML_BLOCK_THRESHOLD: "0.7"
      AIML_MODEL_DIR: "/app/models"
    volumes:
      - model_data:/app/models
      - attack_data:/app/attack_samples

  dashboard:
    build:
      context: ..
      dockerfile: AIMMLSecurity/Dockerfile
      target: dashboard
    ports:
      - "8501:8501"
    environment:
      AIML_BLOCK_THRESHOLD: "0.7"
      AIML_MODEL_DIR: "/app/models"
    volumes:
      - model_data:/app/models
      - attack_data:/app/attack_samples
    depends_on:
      - api

volumes:
  model_data:
  attack_data:
