[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasecurity"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "typer>=0.15",
    "streamlit>=1.40",
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "faker>=30.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
datasec = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
omit = ["*/dashboard/*", "*/cli.py", "*/db/postgres_adapter.py", "*/db/mysql_adapter.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF"]
ignore = [
    "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0913",
    "TC001", "TC002", "TC003",
    "RUF002", "RUF003",
    "SIM103", "SIM105", "SIM108",
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/*" = ["E402", "PLC0415"]
"src/cli.py" = ["PLC0415", "PTH123"]
"src/audit/access_logger.py" = ["PLC0415"]
"tests/unit/test_tokenizer.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["typer", "typer.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
