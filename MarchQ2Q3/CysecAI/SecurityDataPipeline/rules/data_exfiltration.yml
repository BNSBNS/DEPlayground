title: Large Outbound Data Transfer
id: sigma-de-001
status: stable
description: Detects unusually large outbound data transfers that may indicate exfiltration
level: critical
logsource:
    category: network
    product: firewall
detection:
    selection:
        event_type: connection_allowed
        action: allow
    filter_large:
        bytes_sent|gt: 100000
    condition: selection and filter_large
tags:
    - attack.exfiltration
    - attack.t1048
