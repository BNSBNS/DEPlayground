services:
  api:
    build:
      context: ..
      dockerfile: SecurityDataPipeline/Dockerfile
      target: api
    ports:
      - "8000:8000"
    volumes:
      - siem-data:/app/data
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ..
      dockerfile: SecurityDataPipeline/Dockerfile
      target: dashboard
    ports:
      - "8501:8501"
    volumes:
      - siem-data:/app/data
    environment:
      - PYTHONPATH=/app
    depends_on:
      api:
        condition: service_healthy

volumes:
  siem-data:
