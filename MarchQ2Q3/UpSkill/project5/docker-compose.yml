services:
  app:
    build: .
    ports:
      - "8050:8050"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
      POSTGRES_DB: data_contracts
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
