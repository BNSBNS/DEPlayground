version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: orders
        columns:
          - name: id
            tests:
              - not_null
              - unique
          - name: customer_id
            tests:
              - not_null
          - name: amount
            tests:
              - not_null

      - name: customers
        columns:
          - name: id
            tests:
              - not_null
              - unique
          - name: email
            tests:
              - not_null
              - unique

      - name: payments
        columns:
          - name: id
            tests:
              - not_null
              - unique
          - name: order_id
            tests:
              - not_null

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: email
        tests:
          - not_null

  - name: stg_payments
    columns:
      - name: payment_id
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null

  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
    tests:
      - dbt_utils.recency:
          datepart: day
          field: updated_at
          interval: 1

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
