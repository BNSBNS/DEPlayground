[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-feature-store"
version = "0.1.0"
description = "ML Feature Store with batch/stream compute, online/offline serving, and drift monitoring"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "aiokafka>=0.12.0",
    "redis[hiredis]>=5.2.0",
    "prometheus-client>=0.21.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
