[project]
name = "bare-agents-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic", "structlog", "httpx"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "ERA", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
