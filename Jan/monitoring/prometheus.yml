# Prometheus configuration for Energy Trading Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Trade API metrics (disabled - no /metrics endpoint yet)
  # - job_name: "trade-api"
  #   static_configs:
  #     - targets: ["api:8000"]
  #   metrics_path: /metrics

  # Trade Consumer metrics
  - job_name: "trade-consumer"
    static_configs:
      - targets: ["consumer:8001"]
    metrics_path: /metrics

  # Trade Producer metrics (if exposed)
  - job_name: "trade-producer"
    static_configs:
      - targets: ["producer:8002"]
    metrics_path: /metrics
