# Grafana datasource provisioning

apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # TimescaleDB for trade data
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    url: timescaledb:5432
    database: trades
    user: trading
    secureJsonData:
      password: trading
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
