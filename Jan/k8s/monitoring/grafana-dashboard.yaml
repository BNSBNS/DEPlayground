# Grafana Dashboard ConfigMap
# Q1a: Energy Trading Platform Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  trading-platform.json: |
    {
      "dashboard": {
        "title": "Energy Trading Platform",
        "uid": "trading-platform",
        "timezone": "utc",
        "refresh": "10s",
        "panels": [
          {
            "title": "Consumer Lag by Partition",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "kafka_consumergroup_lag{consumergroup=\"trade-aggregator\"}",
                "legendFormat": "partition-{{partition}}"
              }
            ]
          },
          {
            "title": "Messages Processed/sec",
            "type": "timeseries",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(messages_processed_total[1m])",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "title": "DLQ Message Count",
            "type": "stat",
            "gridPos": {"x": 0, "y": 8, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "sum(dlq_messages_total)",
                "legendFormat": "DLQ Count"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": {
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 1, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "title": "Active Consumer Pods",
            "type": "stat",
            "gridPos": {"x": 6, "y": 8, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "count(up{job=\"trade-consumer\"})",
                "legendFormat": "Pods"
              }
            ]
          },
          {
            "title": "Data Freshness (seconds)",
            "type": "gauge",
            "gridPos": {"x": 12, "y": 8, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "max(data_freshness_seconds)",
                "legendFormat": "Freshness"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": {
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 30, "color": "yellow"},
                    {"value": 60, "color": "red"}
                  ]
                },
                "max": 120
              }
            }
          },
          {
            "title": "DB Write Latency P99",
            "type": "gauge",
            "gridPos": {"x": 18, "y": 8, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "histogram_quantile(0.99, rate(db_write_duration_seconds_bucket[5m]))",
                "legendFormat": "P99"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "thresholds": {
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 0.1, "color": "yellow"},
                    {"value": 0.5, "color": "red"}
                  ]
                }
              }
            }
          },
          {
            "title": "Processing Latency (P50, P95, P99)",
            "type": "timeseries",
            "gridPos": {"x": 0, "y": 12, "w": 24, "h": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.50, rate(processing_duration_seconds_bucket[5m]))",
                "legendFormat": "P50"
              },
              {
                "expr": "histogram_quantile(0.95, rate(processing_duration_seconds_bucket[5m]))",
                "legendFormat": "P95"
              },
              {
                "expr": "histogram_quantile(0.99, rate(processing_duration_seconds_bucket[5m]))",
                "legendFormat": "P99"
              }
            ]
          }
        ]
      }
    }
